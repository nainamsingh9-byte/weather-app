<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather app">
        <h1> 🌤️Weather App</h1>
        <p class="subtitle">Check weather in your city</p>
        <div class="search-box">
            <input
             type="text"
             id="cityInput"
             placeholder="Enter city name..."
             >
             <button id="searchBtn">Search</button>
        </div>
        <p id="message">Enter a city to check its weather.</p>
        <section class="weather-card">
            <h2 id="cityName">Your City</h2>
            <div class="weather-icon" id="weatherIcon">🌤️</div>
            <h3 id="temperature">--°C</h3>
            <p id="condition">Weather condition</p>
            <div class="Weather-deatils">
                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>
                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>

            </div>
        </section>
        <footer>
            <p>Made with ❤️ using HTML, CSS & JavaScript</p>
        </footer>

    </div>
    <script src="script.js"></script>
    
</body>
</html>
